name: Apps Script 배포

# apps-script/ 폴더가 바뀌어 main에 올라오면
# 1) Apps Script 프로젝트에 코드를 올리고(clasp push)
# 2) 지금 쓰는 웹앱 배포를 새 버전으로 바꿉니다(clasp deploy -i). 웹앱 URL은 그대로예요.
#
# 필요한 설정 (레포 Settings → Secrets and variables → Actions)
#   Secrets   CLASPRC_JSON      : clasp login 후 생기는 .clasprc.json 내용 전체
#   Variables GAS_SCRIPT_ID     : Apps Script 프로젝트 설정의 '스크립트 ID'
#             GAS_DEPLOYMENT_ID : 웹앱 URL의 /s/ 와 /exec 사이 문자열 (AKfycb…)

on:
  push:
    branches: [main]
    paths:
      - 'apps-script/**'
      - '.github/workflows/apps-script.yml'
  workflow_dispatch:

concurrency:
  group: apps-script-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: 설정 확인
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
          GAS_SCRIPT_ID: ${{ vars.GAS_SCRIPT_ID }}
          GAS_DEPLOYMENT_ID: ${{ vars.GAS_DEPLOYMENT_ID }}
        run: |
          missing=""
          [ -z "$CLASPRC_JSON" ] && missing="$missing CLASPRC_JSON"
          [ -z "$GAS_SCRIPT_ID" ] && missing="$missing GAS_SCRIPT_ID"
          [ -z "$GAS_DEPLOYMENT_ID" ] && missing="$missing GAS_DEPLOYMENT_ID"
          if [ -n "$missing" ]; then
            echo "::error::레포 설정에 다음 값이 없어요:$missing (README의 '코드 자동 배포' 참고)"
            exit 1
          fi

      - uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: clasp 설치
        run: npm install -g @google/clasp@2.4.2

      - name: 인증 정보 쓰기
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
          GAS_SCRIPT_ID: ${{ vars.GAS_SCRIPT_ID }}
        run: |
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          printf '{"scriptId":"%s","rootDir":"apps-script"}' "$GAS_SCRIPT_ID" > .clasp.json

      - name: 코드 올리기
        run: |
          set +e
          out=$(clasp push --force 2>&1); code=$?
          echo "$out"
          if [ $code -ne 0 ] || echo "$out" | grep -qiE 'error|invalid_grant|unauthorized|permission'; then
            msg=$(echo "$out" | tr '\n' ' ' | sed 's/[[:space:]]\+/ /g' | cut -c1-600)
            echo "::error title=clasp push 실패::$msg"
            exit 1
          fi

      - name: 웹앱 새 버전으로 배포
        env:
          GAS_DEPLOYMENT_ID: ${{ vars.GAS_DEPLOYMENT_ID }}
        run: |
          set +e
          out=$(clasp deploy --deploymentId "$GAS_DEPLOYMENT_ID" --description "GitHub ${GITHUB_SHA::7}" 2>&1); code=$?
          echo "$out"
          if [ $code -ne 0 ]; then
            echo "::error title=clasp deploy 실패::$(echo "$out" | tr '\n' ' ' | cut -c1-600)"
            exit 1
          fi
